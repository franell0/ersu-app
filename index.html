<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <title>Accesso</title>
</head>
<body>
  <form id="f">
    <input id="email" type="email" placeholder="Email" required>
    <input id="pw" type="password" placeholder="Password" required>
    <button>Entra</button>
    <p id="msg"></p>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
const sb = supabase.createClient("https://nlhembjbyotzfyzxlmpa.supabase.co", "sb_publishable_jz17xeUAkt0P8LHSawLvjw_A3nbn33_");
    const msg = document.getElementById("msg");

    let deviceId = localStorage.getItem("did");
    if (!deviceId) { deviceId = crypto.randomUUID(); localStorage.setItem("did", deviceId); }

    async function openApp() {
      const { data, error } = await sb.functions.invoke("get-app", { body: { deviceId } });
      if (error) {
msg.textContent = (error.context && error.context.text) ? await error.context.text() : error.message;
        return;
      }
      document.open(); document.write(data); document.close();
    }

    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById("email").value,
        password: document.getElementById("pw").value,
      });
if (error) { msg.textContent = error.message; return; }
      openApp();
    });

    // se la sessione esiste già, entra direttamente
    sb.auth.getSession().then(({ data }) => { if (data.session) openApp(); });
  </script>
</body>
</html>
